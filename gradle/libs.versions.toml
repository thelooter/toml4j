[versions]
gson = "2.14.0"
junit = "6.1.1"
hamcrest = "3.0"
jacoco = "0.8.14"
vanniktech-maven-publish = "0.36.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# JUnit artifacts are aligned by the BOM, so they intentionally carry no version of their own.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[plugins]
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
